---
# --- Web app: the concierge's browser login (confidential client, code + PKCE) ------------
resource_type: application
id: 019a5cb2-0000-7000-8000-000000000040
name: hardrock-concierge-web
description: Hard Rock Miami concierge web chat (server-side confidential client)
type: fullstack
ouHandle: default
authFlowHandle: hardrock-password-login
allowedUserTypes:
  - Person
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: "{{.WEB_CLIENT_ID}}"
      clientSecret: "{{.WEB_CLIENT_SECRET}}"
      redirectUris:
#WEB_REDIRECT_URIS#
      grantTypes:
        - authorization_code
        - refresh_token
      responseTypes:
        - code
      tokenEndpointAuthMethod: client_secret_basic
      publicClient: false
      pkceRequired: true
      scopes:
        - openid
        - profile
        - hotel:read
        - bookings:read
        - bookings:write
        - unity:read
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes:
              - username
              - name
        idToken:
          validityPeriod: 3600
          userAttributes:
            - username
            - name
            - given_name
            - family_name
        refreshToken:
          validityPeriod: 86400
      scopeClaims:
        profile:
          - name
          - given_name
          - family_name
          - username

---
# --- Role: what a signed-in guest may do ---------------------------------------------------
resource_type: role
id: 019a5cb2-0000-7000-8000-000000000060
name: hardrock-guest
description: Hard Rock Miami concierge guest permissions
ouHandle: default
permissions:
  - resourceServerId: 019a5cb2-0000-7000-8000-000000000010
    permissions:
      - hotel:read
      - bookings:read
      - bookings:write
      - unity:read
assignments:
  - id: 019a5cb2-0000-7000-8000-000000000031
    type: user
  - id: 019a5cb2-0000-7000-8000-000000000032
    type: user
  - id: 019a5cb2-0000-7000-8000-000000000033
    type: user
